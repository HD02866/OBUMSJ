<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="islamicDayPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Background Guide Crossings -->
      <path d="M0,0 L120,120 M120,0 L0,120" stroke="#b88a44" stroke-width="0.7" stroke-opacity="0.18" fill="none" />
      <path d="M60,0 L120,60 L60,120 L0,60 Z" stroke="#a0712d" stroke-width="0.8" stroke-opacity="0.22" fill="none" />
      
      <!-- Central Arabesque 8-Pointed Star -->
      <polygon points="60,35 67,52 85,45 77,60 85,75 67,68 60,85 53,68 35,75 43,60 35,45 53,52" 
               stroke="#a0712d" stroke-width="1.2" stroke-opacity="0.35" fill="#c29438" fill-opacity="0.04" />
      
      <!-- Inner Rosette Starlet -->
      <polygon points="60,45 64,55 75,50 70,60 75,70 64,65 60,75 56,65 45,70 50,60 45,50 56,55" 
               stroke="#b88a44" stroke-width="0.8" stroke-opacity="0.3" fill="none" />
      <circle cx="60" cy="60" r="3" fill="#b88a44" fill-opacity="0.25" />

      <!-- Corner 8-Pointed Stars (Seamless tiling quarters) -->
      <!-- Top-Left (0,0) -->
      <polygon points="0,-25 7,-8 25,-15 17,0 25,15 7,8 0,25 -7,8 -25,15 -17,0 -25,-15 -7,-8" 
               stroke="#a0712d" stroke-width="1.2" stroke-opacity="0.35" fill="#c29438" fill-opacity="0.04" />
      <circle cx="0" cy="0" r="3" fill="#b88a44" fill-opacity="0.25" />

      <!-- Top-Right (120,0) -->
      <polygon points="120,-25 127,-8 145,-15 137,0 145,15 127,8 120,25 113,8 95,15 103,0 95,-15 113,-8" 
               stroke="#a0712d" stroke-width="1.2" stroke-opacity="0.35" fill="#c29438" fill-opacity="0.04" />
      <circle cx="120" cy="0" r="3" fill="#b88a44" fill-opacity="0.25" />

      <!-- Bottom-Left (0,120) -->
      <polygon points="0,95 7,112 25,105 17,120 25,135 7,128 0,145 -7,128 -25,135 -17,120 -25,105 -7,112" 
               stroke="#a0712d" stroke-width="1.2" stroke-opacity="0.35" fill="#c29438" fill-opacity="0.04" />
      <circle cx="0" cy="120" r="3" fill="#b88a44" fill-opacity="0.25" />

      <!-- Bottom-Right (120,120) -->
      <polygon points="120,95 127,112 145,105 137,120 145,135 127,128 120,145 113,128 95,135 103,120 95,105 113,112" 
               stroke="#a0712d" stroke-width="1.2" stroke-opacity="0.35" fill="#c29438" fill-opacity="0.04" />
      <circle cx="120" cy="120" r="3" fill="#b88a44" fill-opacity="0.25" />

      <!-- Interconnecting Geometric Arabesque Lines -->
      <path d="M60,0 L60,35 M60,85 L60,120 M0,60 L35,60 M85,60 L120,60" stroke="#a0712d" stroke-width="0.9" stroke-opacity="0.28" />
      <path d="M17,17 L43,43 M77,43 L103,17 M17,103 L43,77 M77,77 L103,103" stroke="#b88a44" stroke-width="0.7" stroke-opacity="0.2" />
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#islamicDayPattern)" />
</svg>
