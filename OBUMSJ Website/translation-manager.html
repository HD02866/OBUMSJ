<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Manager | OBUMSJ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/theme-engine.js"></script>
    <style>
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px 20px;
            background: var(--bg-base, #faf6ee);
            color: var(--text-primary, #1e1610);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-card, #ffffff);
            padding: 35px 30px;
            border-radius: var(--radius-lg, 14px);
            border: 1px solid var(--border-color, rgba(160, 113, 45, 0.22));
            box-shadow: var(--shadow-md, 0 6px 18px rgba(18, 38, 63, 0.08));
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color, rgba(160, 113, 45, 0.18));
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--primary, #1b5e20);
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .theme-toggle-btn {
            background: var(--bg-card-subtle, #f8f4ec);
            border: 1px solid var(--border-color, rgba(160, 113, 45, 0.3));
            color: var(--text-primary, #1e1610);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .theme-toggle-btn:hover {
            background: var(--gold, #c59a3f);
            color: #140c07;
        }
        .language-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .language-tabs button {
            padding: 10px 22px;
            border: 1px solid var(--border-color, rgba(160, 113, 45, 0.25));
            background: var(--bg-card-subtle, #f8f4ec);
            color: var(--text-primary, #1e1610);
            border-radius: var(--radius-sm, 6px);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }
        .language-tabs button:hover {
            border-color: var(--primary, #1b5e20);
            background: rgba(27, 94, 32, 0.08);
        }
        .language-tabs button.active {
            background: var(--primary, #1b5e20);
            color: #ffffff;
            border-color: var(--primary, #1b5e20);
        }
        [data-theme="dark"] .language-tabs button.active,
        [data-theme="night"] .language-tabs button.active,
        body.dark-mode .language-tabs button.active {
            background: var(--gold, #d4af37);
            color: #140c07;
            border-color: var(--gold, #d4af37);
        }
        .translation-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border: 1px solid var(--border-color, rgba(160, 113, 45, 0.2));
            border-radius: var(--radius-md, 8px);
            overflow: hidden;
        }
        .translation-table th, .translation-table td {
            border-bottom: 1px solid var(--border-color, rgba(160, 113, 45, 0.15));
            padding: 14px 16px;
            text-align: left;
        }
        .translation-table th {
            background: var(--bg-card-subtle, #f8f4ec);
            color: var(--primary, #1b5e20);
            font-weight: 700;
            font-size: 0.9rem;
        }
        [data-theme="dark"] .translation-table th,
        [data-theme="night"] .translation-table th,
        body.dark-mode .translation-table th {
            background: #1a100a;
            color: var(--gold, #d4af37);
        }
        .key-column {
            width: 32%;
            background: rgba(0, 0, 0, 0.02);
            font-family: monospace;
            font-size: 0.88rem;
            color: var(--text-primary);
        }
        .translation-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-xs, 4px);
            background: var(--bg-card, #ffffff);
            color: var(--text-primary, #1e1610);
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .translation-input:focus {
            outline: none;
            border-color: var(--primary, #1b5e20);
            box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.15);
        }
        [data-theme="dark"] .translation-input,
        [data-theme="night"] .translation-input,
        body.dark-mode .translation-input {
            background: #1b1009;
            color: #f5ebd7;
            border-color: rgba(212, 175, 55, 0.3);
        }
        .char-count {
            font-size: 0.85rem;
            color: var(--text-muted, #8c786a);
            text-align: center;
            width: 90px;
        }
        .save-btn {
            background: var(--primary, #1b5e20);
            color: #ffffff;
            border: 1px solid var(--primary-hover, #144918);
            padding: 12px 28px;
            border-radius: var(--radius-sm, 6px);
            cursor: pointer;
            margin-top: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }
        .save-btn:hover {
            background: var(--secondary, #2e7d32);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        [data-theme="dark"] .save-btn,
        [data-theme="night"] .save-btn,
        body.dark-mode .save-btn {
            background: var(--gold, #d4af37);
            color: #140c07;
            border-color: #fae084;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1><i class="fas fa-language"></i> Translation Manager</h1>
            <button id="darkModeToggle" class="theme-toggle-btn" aria-label="Toggle Day and Night theme" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        
        <div class="language-tabs">
            <button onclick="switchLanguage('en')" class="active">English</button>
            <button onclick="switchLanguage('am')">Amharic</button>
            <button onclick="switchLanguage('om')">Oromo</button>
            <button onclick="switchLanguage('ar')">Arabic</button>
        </div>
        
        <div class="table-responsive" style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
        <table class="translation-table">
            <thead>
                <tr>
                    <th>Translation Key</th>
                    <th>Translation Value</th>
                    <th style="text-align:center;">Characters</th>
                </tr>
            </thead>
            <tbody id="translationBody">
                <!-- Will be populated by JavaScript -->
            </tbody>
        </table>
        </div>
        
        <button class="save-btn" onclick="saveTranslations()"><i class="fas fa-save"></i> Save Translations</button>
    </div>

    <script>
        let currentLanguage = 'en';
        let translations = {};
        
        // Load English translation as template
        fetch('./js/en.json')
            .then(response => response.json())
            .then(data => {
                translations.en = data;
                loadLanguage('en');
            });
        
        function switchLanguage(lang) {
            currentLanguage = lang;
            
            // Update active tab
            document.querySelectorAll('.language-tabs button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Load translations for this language
            loadLanguage(lang);
        }
        
        function loadLanguage(lang) {
            fetch(`./js/${lang}.json`)
                .then(response => response.json())
                .then(data => {
                    translations[lang] = data;
                    populateTable();
                })
                .catch(error => {
                    console.log(`No translations found for ${lang}, starting with empty`);
                    translations[lang] = {};
                    populateTable();
                });
        }
        
        function populateTable() {
            const tbody = document.getElementById('translationBody');
            tbody.innerHTML = '';
            
            const keys = Object.keys(translations.en).sort();
            
            keys.forEach(key => {
                const row = document.createElement('tr');
                
                // Key column
                const keyCell = document.createElement('td');
                keyCell.className = 'key-column';
                keyCell.textContent = key;
                
                // Translation column
                const transCell = document.createElement('td');
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'translation-input';
                input.value = translations[currentLanguage][key] || '';
                input.oninput = function() {
                    translations[currentLanguage][key] = this.value;
                    updateCharacterCount(row, this.value);
                };
                transCell.appendChild(input);
                
                // Character count column
                const countCell = document.createElement('td');
                countCell.className = 'char-count';
                countCell.textContent = input.value.length;
                
                row.appendChild(keyCell);
                row.appendChild(transCell);
                row.appendChild(countCell);
                tbody.appendChild(row);
                
                // Initial character count
                updateCharacterCount(row, input.value);
            });
        }
        
        function updateCharacterCount(row, value) {
            const countCell = row.querySelector('.char-count');
            countCell.textContent = value.length;
            
            // Highlight long translations
            if (value.length > 200) {
                countCell.style.color = 'red';
                countCell.style.fontWeight = 'bold';
            } else {
                countCell.style.color = 'inherit';
                countCell.style.fontWeight = 'normal';
            }
        }
        
        function saveTranslations() {
            // Save to JSON file (this would need a server-side script in production)
            const dataStr = JSON.stringify(translations[currentLanguage], null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            // Create download link
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `${currentLanguage}.json`;
            link.click();
            
            alert(`Translations for ${currentLanguage} downloaded. Replace the file in /js/ folder.`);
        }
    </script>
</body>
</html>
